name: Sync Slides Product Pages

on:
  push:
    branches:
      - master
    paths:
      - "slides/**"
      - ".github/workflows/main.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-slides-products-to-main-repository
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to products.aspose.com
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate destination token
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::REPO_TOKEN is not configured"
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Checkout destination repository
        uses: actions/checkout@v7
        with:
          repository: Aspose/products.aspose.com
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: destination

      - name: Synchronize Slides product pages
        run: |
          set -euo pipefail

          mkdir -p destination/content/slides

          rsync \
            --archive \
            --delete \
            source/slides/ \
            destination/content/slides/

      - name: Commit and push changes
        working-directory: destination
        run: |
          set -euo pipefail

          git config user.name "aspose-slides-sync[bot]"
          git config user.email \
            "aspose-slides-sync[bot]@users.noreply.github.com"

          git add -A content/slides

          if git diff --cached --quiet; then
            echo "The destination repository is already up to date."
            exit 0
          fi

          git commit \
            -m "Sync Aspose.Slides product pages from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"

          git push origin HEAD:main
